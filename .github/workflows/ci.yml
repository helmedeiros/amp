name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    # Pure unit tests run on Linux; osascript integration tests are excluded
    # (they require macOS + Music.app and are run via `make integration`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tools
        run: |
          go install gotest.tools/gotestsum@latest
          # Installed from the module proxy rather than install.sh: the v2.13.2
          # release tarball does not match its own published checksum.
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Quality gate
        run: make ci
